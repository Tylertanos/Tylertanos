<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg"> <defs> <!-- Matrix Background --> <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" stop-color="#010302"> <animate attributeName="stop-color" values="#010302;#03140a;#010302" dur="12s" repeatCount="indefinite"/> </stop> <stop offset="100%" stop-color="#04110b"> <animate attributeName="stop-color" values="#04110b;#062016;#04110b" dur="12s" repeatCount="indefinite"/> </stop> </linearGradient> <!-- Matrix Glow --> <filter id="matrixGlow"> <feGaussianBlur stdDeviation="2" result="blur"/> <feMerge> <feMergeNode in="blur"/> <feMergeNode in="SourceGraphic"/> </feMerge> </filter> <!-- Scanlines --> <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"> <rect width="4" height="2" fill="rgba(255,255,255,0.02)" /> </pattern> </defs> <!-- Background --> <rect width="1600" height="420" fill="url(#matrixBg)" /> <!-- Matrix Columns --> <g font-family="monospace" font-size="22" fill="#00ff88" filter="url(#matrixGlow)" > <!-- Column 1 --> <text x="120" y="-200"> 101101010101 <animate attributeName="y" values="-200;520" dur="7s" repeatCount="indefinite"/> </text> <!-- Column 2 --> <text x="260" y="-400" opacity="0.7"> ACCESSGRANTED <animate attributeName="y" values="-400;520" dur="9s" repeatCount="indefinite"/> </text> <!-- Column 3 --> <text x="420" y="-300" opacity="0.5"> SYSTEMACTIVE <animate attributeName="y" values="-300;520" dur="8s" repeatCount="indefinite"/> </text> <!-- Column 4 --> <text x="610" y="-500"> 010010101010 <animate attributeName="y" values="-500;520" dur="10s" repeatCount="indefinite"/> </text> <!-- Column 5 --> <text x="760" y="-250" opacity="0.8"> HYPERDROID <animate attributeName="y" values="-250;520" dur="6s" repeatCount="indefinite"/> </text> <!-- Column 6 --> <text x="930" y="-450" opacity="0.6"> 110101001011 <animate attributeName="y" values="-450;520" dur="11s" repeatCount="indefinite"/> </text> <!-- Column 7 --> <text x="1120" y="-350"> TERMINALONLINE <animate attributeName="y" values="-350;520" dur="8.5s" repeatCount="indefinite"/> </text> <!-- Column 8 --> <text x="1320" y="-500" opacity="0.7"> 001101010101 <animate attributeName="y" values="-500;520" dur="9.5s" repeatCount="indefinite"/> </text> <!-- Column 9 --> <text x="1480" y="-280" opacity="0.5"> ACCESSNODE <animate attributeName="y" values="-280;520" dur="7.5s" repeatCount="indefinite"/> </text> </g> <!-- Faint Floating Symbols --> <g font-family="monospace" font-size="14" fill="#00ff99" opacity="0.15" > <text x="180" y="120">01101010</text> <text x="540" y="240">11010101</text> <text x="920" y="180">10100111</text> <text x="1280" y="300">01011001</text> </g> <!-- Pulse Glow --> <rect width="1600" height="420" fill="#00ff88" opacity="0.02"> <animate attributeName="opacity" values="0.01;0.04;0.01" dur="5s" repeatCount="indefinite"/> </rect> <!-- Digital Grid --> <g opacity="0.05"> <line x1="0" y1="70" x2="1600" y2="70" stroke="#00ff88" stroke-width="1"/> <line x1="0" y1="140" x2="1600" y2="140" stroke="#00ff88" stroke-width="1"/> <line x1="0" y1="210" x2="1600" y2="210" stroke="#00ff88" stroke-width="1"/> <line x1="0" y1="280" x2="1600" y2="280" stroke="#00ff88" stroke-width="1"/> <line x1="0" y1="350" x2="1600" y2="350" stroke="#00ff88" stroke-width="1"/> </g> <!-- Flicker --> <rect width="1600" height="420" fill="#00ff88" opacity="0"> <animate attributeName="opacity" values="0;0.02;0" dur="0.12s" repeatCount="indefinite"/> </rect> <!-- Scanline Overlay --> <rect width="1600" height="420" fill="url(#scanlines)" opacity="0.18"/> </svg>
