<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg"> <defs> <!-- Background Gradient --> <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" stop-color="#020304"> <animate attributeName="stop-color" values="#020304;#07110a;#020304" dur="10s" repeatCount="indefinite"/> </stop> <stop offset="100%" stop-color="#041a0d"> <animate attributeName="stop-color" values="#041a0d;#03150a;#041a0d" dur="10s" repeatCount="indefinite"/> </stop> </linearGradient> <!-- Glow --> <filter id="glow"> <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/> <feMerge> <feMergeNode in="coloredBlur"/> <feMergeNode in="SourceGraphic"/> </feMerge> </filter> <!-- Scanlines --> <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"> <rect width="4" height="2" fill="rgba(255,255,255,0.03)" /> </pattern> </defs> <!-- Background --> <rect width="1600" height="420" fill="url(#bg)" /> <!-- Noise Dots --> <g opacity="0.12"> <circle cx="200" cy="50" r="1" fill="#00ff99"/> <circle cx="1200" cy="90" r="1" fill="#00ff99"/> <circle cx="400" cy="350" r="1" fill="#00ff99"/> <circle cx="900" cy="270" r="1" fill="#00ff99"/> <circle cx="1450" cy="180" r="1" fill="#00ff99"/> </g> <!-- Terminal Text --> <g font-family="monospace" font-size="26" fill="#00ff99" filter="url(#glow)" > <text x="70" y="90"> root@hyperdroid:~$ initializing... <animate attributeName="opacity" values="0;1;1" dur="1s" fill="freeze"/> </text> <text x="70" y="140"> root@hyperdroid:~$ connecting to server <animate attributeName="opacity" values="0;0;1" dur="2s" fill="freeze"/> </text> <text x="70" y="190"> root@hyperdroid:~$ bypassing security // <animate attributeName="opacity" values="0;0;0;1" dur="3s" fill="freeze"/> </text> <text x="70" y="240"> root@hyperdroid:~$ access granted <animate attributeName="opacity" values="0;0;0;0;1" dur="4s" fill="freeze"/> </text> <text x="70" y="290"> root@hyperdroid:~$ _ <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/> </text> </g> <!-- Floating Diagnostics --> <g font-family="monospace" font-size="14" fill="#00ff88" opacity="0.25" > <text x="1180" y="80"> SYSTEM STATUS: ONLINE </text> <text x="1180" y="110"> NETWORK: CONNECTED </text> <text x="1180" y="140"> SECURITY LEVEL: ROOT </text> <text x="1180" y="170"> KERNEL: HYPERDROID </text> <text x="1180" y="200"> MEMORY: 32768MB </text> </g> <!-- Animated Grid --> <g opacity="0.08"> <path d="M0 350 H1600" stroke="#00ff99" stroke-width="1"/> <path d="M0 300 H1600" stroke="#00ff99" stroke-width="1"/> <path d="M0 250 H1600" stroke="#00ff99" stroke-width="1"/> </g> <!-- Random Data Bars --> <g opacity="0.15"> <rect x="300" y="330" width="180" height="3" fill="#00ff99"> <animate attributeName="width" values="50;180;90;220;70" dur="4s" repeatCount="indefinite"/> </rect> <rect x="650" y="350" width="120" height="3" fill="#00ff99"> <animate attributeName="width" values="120;60;200;80" dur="5s" repeatCount="indefinite"/> </rect> </g> <!-- Scanline Overlay --> <rect width="1600" height="420" fill="url(#scanlines)" opacity="0.2" /> <!-- Flicker --> <rect width="1600" height="420" fill="#00ff99" opacity="0"> <animate attributeName="opacity" values="0;0.015;0" dur="0.15s" repeatCount="indefinite"/> </rect> </svg>
