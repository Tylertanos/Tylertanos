<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg"> <defs> <!-- Space Background --> <linearGradient id="space" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" stop-color="#02030d"> <animate attributeName="stop-color" values="#02030d;#090d24;#02030d" dur="18s" repeatCount="indefinite"/> </stop> <stop offset="50%" stop-color="#101b45"> <animate attributeName="stop-color" values="#101b45;#1d1252;#101b45" dur="18s" repeatCount="indefinite"/> </stop> <stop offset="100%" stop-color="#050816"> <animate attributeName="stop-color" values="#050816;#0a1033;#050816" dur="18s" repeatCount="indefinite"/> </stop> </linearGradient> <!-- Glow --> <filter id="starGlow"> <feGaussianBlur stdDeviation="2" result="blur"/> <feMerge> <feMergeNode in="blur"/> <feMergeNode in="SourceGraphic"/> </feMerge> </filter> </defs> <!-- Background --> <rect width="1600" height="420" fill="url(#space)" /> <!-- Nebula --> <g opacity="0.22"> <ellipse cx="420" cy="180" rx="260" ry="90" fill="#6b5cff"> <animate attributeName="rx" values="240;270;240" dur="14s" repeatCount="indefinite"/> </ellipse> <ellipse cx="1180" cy="260" rx="320" ry="100" fill="#3a7bff"> <animate attributeName="rx" values="300;340;300" dur="16s" repeatCount="indefinite"/> </ellipse> </g> <!-- Tiny Stars --> <g fill="white"> <circle cx="70" cy="40" r="1.2"> <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/> </circle> <circle cx="190" cy="120" r="1.5"> <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/> </circle> <circle cx="420" cy="60" r="1.3"> <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/> </circle> <circle cx="660" cy="90" r="1.7"> <animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/> </circle> <circle cx="840" cy="170" r="1.2"> <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/> </circle> <circle cx="1020" cy="70" r="1.6"> <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/> </circle> <circle cx="1220" cy="150" r="1.4"> <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/> </circle> <circle cx="1450" cy="90" r="1.5"> <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/> </circle> </g> <!-- Large Glowing Stars --> <g filter="url(#starGlow)"> <circle cx="260" cy="220" r="3" fill="#9fc7ff"> <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/> </circle> <circle cx="980" cy="140" r="4" fill="#d8e6ff"> <animate attributeName="opacity" values="1;0.4;1" dur="5s" repeatCount="indefinite"/> </circle> <circle cx="1360" cy="240" r="3" fill="#ffffff"> <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/> </circle> </g> <!-- Shooting Stars --> <g stroke="#cfe6ff" stroke-width="2" opacity="0.7"> <line x1="150" y1="80" x2="260" y2="120"> <animate attributeName="x1" values="-200;1700" dur="10s" repeatCount="indefinite"/> <animate attributeName="x2" values="-100;1800" dur="10s" repeatCount="indefinite"/> </line> <line x1="900" y1="220" x2="980" y2="250"> <animate attributeName="x1" values="-400;1900" dur="14s" repeatCount="indefinite"/> <animate attributeName="x2" values="-300;2000" dur="14s" repeatCount="indefinite"/> </line> </g> <!-- Floating Starfield Layer --> <g opacity="0.18"> <circle cx="200" cy="300" r="2" fill="#ffffff"> <animate attributeName="cx" values="200;1700" dur="40s" repeatCount="indefinite"/> </circle> <circle cx="780" cy="340" r="1.5" fill="#ffffff"> <animate attributeName="cx" values="780;1800" dur="50s" repeatCount="indefinite"/> </circle> <circle cx="1200" cy="290" r="2" fill="#ffffff"> <animate attributeName="cx" values="1200;1900" dur="60s" repeatCount="indefinite"/> </circle> </g> <!-- Atmospheric Glow --> <rect width="1600" height="420" fill="#5a7dff" opacity="0.03"> <animate attributeName="opacity" values="0.02;0.05;0.02" dur="8s" repeatCount="indefinite"/> </rect> </svg>
