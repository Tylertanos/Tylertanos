<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg"> <defs> <!-- Background --> <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" stop-color="#020817"> <animate attributeName="stop-color" values="#020817;#071b36;#020817" dur="12s" repeatCount="indefinite"/> </stop> <stop offset="100%" stop-color="#04142d"> <animate attributeName="stop-color" values="#04142d;#0a2047;#04142d" dur="12s" repeatCount="indefinite"/> </stop> </linearGradient> <!-- Neon Glow --> <filter id="glow"> <feGaussianBlur stdDeviation="3" result="blur"/> <feMerge> <feMergeNode in="blur"/> <feMergeNode in="SourceGraphic"/> </feMerge> </filter> <!-- Scanlines --> <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"> <rect width="4" height="2" fill="rgba(255,255,255,0.03)" /> </pattern> </defs> <!-- Background --> <rect width="1600" height="420" fill="url(#bg)" /> <!-- Glowing Background Lines --> <g opacity="0.08"> <line x1="0" y1="80" x2="1600" y2="80" stroke="#00aaff" stroke-width="1"/> <line x1="0" y1="140" x2="1600" y2="140" stroke="#00aaff" stroke-width="1"/> <line x1="0" y1="200" x2="1600" y2="200" stroke="#00aaff" stroke-width="1"/> <line x1="0" y1="260" x2="1600" y2="260" stroke="#00aaff" stroke-width="1"/> <line x1="0" y1="320" x2="1600" y2="320" stroke="#00aaff" stroke-width="1"/> </g> <!-- Windows Style Logo --> <g transform="translate(1240,110)" filter="url(#glow)"> <rect x="0" y="0" width="80" height="80" fill="none" stroke="#00c8ff" stroke-width="4"/> <line x1="40" y1="0" x2="40" y2="80" stroke="#00c8ff" stroke-width="4"/> <line x1="0" y1="40" x2="80" y2="40" stroke="#00c8ff" stroke-width="4"/> <animateTransform attributeName="transform" type="translate" values="1240,110;1240,108;1240,110" dur="3s" repeatCount="indefinite"/> </g> <!-- Boot Logs --> <g font-family="monospace" font-size="24" fill="#00c8ff" filter="url(#glow)" > <text x="90" y="90"> [ OK ] Starting system services <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/> </text> <text x="90" y="130"> [ OK ] Checking hardware <animate attributeName="opacity" values="0;0;1" dur="2s" fill="freeze"/> </text> <text x="90" y="170"> [ OK ] Loading drivers <animate attributeName="opacity" values="0;0;0;1" dur="3s" fill="freeze"/> </text> <text x="90" y="210"> [ OK ] Initializing memory <animate attributeName="opacity" values="0;0;0;0;1" dur="4s" fill="freeze"/> </text> <text x="90" y="250"> [ OK ] Preparing environment <animate attributeName="opacity" values="0;0;0;0;0;1" dur="5s" fill="freeze"/> </text> </g> <!-- Progress Bar --> <g transform="translate(500,320)"> <!-- Outer --> <rect width="500" height="24" rx="4" fill="none" stroke="#00c8ff" stroke-width="2" opacity="0.5"/> <!-- Animated Fill --> <rect x="4" y="4" width="0" height="16" rx="2" fill="#00c8ff" filter="url(#glow)"> <animate attributeName="width" values="0;120;220;340;496" dur="6s" repeatCount="indefinite"/> </rect> </g> <!-- Boot Cursor --> <text x="90" y="340" font-family="monospace" font-size="24" fill="#00c8ff" filter="url(#glow)"> system booting _ <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/> </text> <!-- Digital Noise --> <g opacity="0.08"> <rect x="300" y="70" width="8" height="2" fill="#00c8ff"/> <rect x="720" y="190" width="12" height="2" fill="#00c8ff"/> <rect x="940" y="120" width="10" height="2" fill="#00c8ff"/> <rect x="1110" y="300" width="16" height="2" fill="#00c8ff"/> <rect x="1470" y="260" width="6" height="2" fill="#00c8ff"/> </g> <!-- Scanline Overlay --> <rect width="1600" height="420" fill="url(#scanlines)" opacity="0.18"/> <!-- Screen Flicker --> <rect width="1600" height="420" fill="#00c8ff" opacity="0"> <animate attributeName="opacity" values="0;0.02;0" dur="0.15s" repeatCount="indefinite"/> </rect> </svg>
